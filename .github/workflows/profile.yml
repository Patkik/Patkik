name: Profile Telemetry

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Snake in the Akatsuki Crimson & Obsidian palette. Transparent background so it sits inside the HUD frame.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF1E27&color_dots=#181116,#4A080C,#8B110B,#D90429,#FF1E27&color_dot_border=#050406

      - name: Render assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: add a classic PAT (read:user) as METRICS_TOKEN to include private contributions.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/generate.mjs

      - name: Commit
        run: |
          git config user.name "akatsuki-telemetry[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "telemetry: resync akatsuki profile assets [skip ci]" && git push)
